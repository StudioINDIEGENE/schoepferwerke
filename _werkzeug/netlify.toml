# Netlify-Konfiguration für die Schöpferwerke-Seite.
# Statisch, kein Build-Schritt nötig.
[build]
  publish = "."

# Medien und Schriften tragen Versionsnamen und dürfen lange liegen bleiben.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Die Seiten selbst sollen sich bei jeder Änderung sofort erneuern.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
